name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix studio ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: node .agents/skills/mcp-apps-builder/scripts/check-v2.mjs .
      - run: npm --prefix studio run lint
      - run: npm --prefix studio run build
